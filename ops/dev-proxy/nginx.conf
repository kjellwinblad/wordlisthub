worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr notice;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # One helper validates either Basic credentials or a signed browser cookie.
    # This guarantees that every successful Basic login receives a cookie.
    upstream auth_cookie {
        server 127.0.0.1:18085;
        keepalive 2;
    }

    server {
        # Cloudflare Tunnel shares the host network with nginx and reaches this
        # loopback-only endpoint. Neither nginx nor Vite listens on the LAN.
        listen 127.0.0.1:18084;
        server_name _;

        location = /__dev_auth_cookie {
            internal;
            proxy_pass http://auth_cookie/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
        }

        location / {
            auth_request /__dev_auth_cookie;
            auth_request_set $dev_auth_set_cookie
                $upstream_http_x_dev_auth_set_cookie;

            # This header is empty for an already valid cookie.
            add_header Set-Cookie $dev_auth_set_cookie;

            # Native Linux maps this name to loopback. Docker Desktop maps it
            # to the host gateway so nginx can reach Vite in the WSL distro.
            proxy_pass http://host.docker.internal:3000;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;

            proxy_set_header Host localhost:3000;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Vite hot-module replacement uses a WebSocket on this same endpoint.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # nginx consumes the Basic Auth credential; do not send it to Vite.
            proxy_set_header Authorization "";
        }
    }
}
